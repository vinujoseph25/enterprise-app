# SonarQube Configuration
sonar.projectKey=enterprise-react-app
sonar.organization=your-organization
sonar.projectName=Enterprise React Application
sonar.projectVersion=1.0.0

# Source settings
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.exclusions=**/node_modules/**,**/build/**,**/coverage/**,**/*.config.js,**/*.config.ts

# Coverage settings
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/index.ts,**/index.tsx

# Code analysis
sonar.typescript.node=node_modules/.bin/node