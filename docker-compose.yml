version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:80'
    environment:
      - REACT_APP_ENV=production
      - REACT_APP_API_BASE_URL=http://localhost:3001/api
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    restart: unless-stopped

  api:
    image: node:18-alpine
    ports:
      - '3001:3001'
    environment:
      - NODE_ENV=development
    working_dir: /app
    command: npm start
    restart: unless-stopped
